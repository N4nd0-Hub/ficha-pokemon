name: Conectar Pokédex GM às fichas V5.0

on:
  push:
    paths:
      - index.html
      - .github/workflows/pokedex-gm-bridge.yml
      - scripts/ajustar_topo_v5.py
      - styles/topbar-v5.css
      - scripts/repaginar_misc_v5.py
      - styles/misc-v5.css
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir conexão sem alterar a ficha original
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          if "pokedex-gm-bridge.js" in html:
              print("Ponte já instalada; nenhuma alteração necessária.")
          else:
              if "Ficha Interativa - V5.0" not in html or "</body>" not in html:
                  raise SystemExit("O HTML não corresponde à ficha V5.0 esperada.")
              snippet = '\n  <!-- Catálogo público: Pokédex GM V5.0 -->\n  <script src="https://n4nd0-hub.github.io/Pok-dex-GM/pokedex-gm-bridge.js" defer></script>\n'
              index = html.rfind("</body>")
              html = html[:index] + snippet + html[index:]
              path.write_text(html, encoding="utf-8")
              print("Conector adicionado sem modificar as mecânicas existentes.")
          PY
      - name: Reorganizar topo da ficha V5.0
        shell: bash
        run: |
          python3 scripts/ajustar_topo_v5.py
          python3 scripts/repaginar_misc_v5.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("index.html").read_text(encoding="utf-8")
          inline = re.findall(r"<script[^>]*>(.*?)</script>", source, flags=re.S)
          if not inline:
              raise SystemExit("Script interno da ficha não encontrado.")
          Path("/tmp/ficha-v5-inline.js").write_text(max(inline, key=len), encoding="utf-8")
          PY
          node --check /tmp/ficha-v5-inline.js
      - name: Publicar a integração
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Ficha já integrada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Ajustar barra superior e repaginar Miscelânea V5.0"
          git push origin HEAD:main
